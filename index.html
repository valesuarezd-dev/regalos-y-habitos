<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nuestro pacto</title>
  <meta name="theme-color" content="#F3EEF8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1B1526" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pacto">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="offline" class="offline" hidden>
    <div class="offline-card">
      <h1>No se pudo conectar</h1>
      <p>La página necesita la base de datos para que los dos vean lo mismo, así que no guarda nada hasta que se conecte.</p>
      <p class="offline-reason" id="offline-reason"></p>
      <button class="btn primary" data-action="retry">Reintentar</button>
    </div>
  </div>

  <div class="wrap" id="app">
    <header class="top">
      <div>
        <h1 id="title">Nuestro pacto</h1>
        <p id="couple" class="couple"></p>
      </div>
      <div class="top-actions">
        <span id="sync" class="sync" aria-live="polite"></span>
        <button class="icon-btn" data-action="settings" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66a.49.49 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.66Z"/></svg>
        </button>
      </div>
    </header>

    <p id="profile" class="profile"></p>


    <section class="paths" aria-labelledby="paths-h">
      <h2 id="paths-h">Camino de regalos</h2>
      <div id="paths-body"></div>
    </section>

    <section class="today" aria-labelledby="today-h">
      <div class="sec-head">
        <h2 id="today-h">Hoy</h2>
        <button class="btn primary" data-action="new-habit">Agregar hábito</button>
      </div>
      <div id="habits-body"></div>
    </section>

    <section class="pending" aria-labelledby="pending-h">
      <h2 id="pending-h">Por entregar</h2>
      <div id="pending-body"></div>
    </section>

    <section class="history">
      <details>
        <summary>Historial</summary>
        <div id="history-body"></div>
      </details>
    </section>
  </div>

  <dialog id="dlg" aria-modal="true"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
